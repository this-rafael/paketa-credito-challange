services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/menu
      LOG_LEVEL: info
      JSON_BODY_LIMIT: 100kb
    depends_on:
      - mongodb

volumes:
  mongodb_data:
