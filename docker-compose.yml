services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/menu
      LOG_LEVEL: info
      JSON_BODY_LIMIT: 100kb
    depends_on:
      - mongodb

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '4200:80'
    depends_on:
      - api

volumes:
  mongodb_data:
