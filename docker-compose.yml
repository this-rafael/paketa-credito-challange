services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 5s
      timeout: 5s
      retries: 10

  tempo:
    image: grafana/tempo:2.6.1
    command: ['-config.file=/etc/tempo.yml']
    ports:
      - '3200:3200'
    volumes:
      - ./observability/tempo/tempo.yml:/etc/tempo.yml:ro,Z

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.114.0
    command: ['--config=/etc/otel-collector.yml']
    ports:
      - '4317:4317'
      - '4318:4318'
      - '8889:8889'
    volumes:
      - ./observability/collector/otel-collector.yml:/etc/otel-collector.yml:ro,Z
    depends_on:
      - tempo

  prometheus:
    image: prom/prometheus:v2.55.1
    ports:
      - '9090:9090'
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    depends_on:
      - otel-collector

  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - '3001:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: dark
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,Z
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro,Z
    depends_on:
      - prometheus
      - tempo

  api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/menu
      LOG_LEVEL: info
      JSON_BODY_LIMIT: 100kb
      OTEL_ENABLED: 'true'
      OTEL_SERVICE_NAME: menu-api
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      NODE_ENV: production
    depends_on:
      - mongodb
      - otel-collector
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - '4200:80'
    depends_on:
      - api
      - otel-collector

volumes:
  mongodb_data:
  grafana_data:
