services:
  mongodb:
    image: mongo:7
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/menu
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      JSON_BODY_LIMIT: 100kb
      ENABLE_DISTRIBUTED_LOCK: 'true'
      LOCK_TTL_MS: '5000'
      LOCK_RETRY_COUNT: '10'
    depends_on:
      - mongodb
      - redis

volumes:
  mongodb_data:
